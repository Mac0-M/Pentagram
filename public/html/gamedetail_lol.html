<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gamedetail - LOL</title>

    <link rel="stylesheet" href="../css/gamedetail-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "app-bg": "#162447",
              "card-bg": "#1F4068",
              "nav-bg": "#1B1B2F",
              win: "#40AFFF",
              lose: "#FF4060",
              gold: "#FABC60",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-900 text-white font-sans antialiased">
    <div class="app-container">
      <div class="top-fixed-section">
        <nav class="navbar">
          <a href="javascript:void(0)" id="home-logo">
            <img
              src="../resource/pentagram-logo.png"
              alt="Pentagram Logo"
              class="navbar-logo"
            />
          </a>
          <div class="close-icon"><i class="fa-solid fa-xmark"></i></div>
        </nav>

        <div class="game-selector-panel">
          <div class="game-selector-header">
            <h2 style="font-size: 18px; font-weight: bold">Game Details</h2>
            <i
              class="fa-regular fa-circle-xmark"
              style="cursor: pointer; font-size: 20px"
            ></i>
          </div>
          <div class="game-btn-grid">
            <a id="btn-dota2" href="./gamedetail_dota2.html" class="game-btn">
              <img
                src="../resource/dota2-logo.png"
                alt="Dota 2"
                style="width: 32px; height: 32px; object-fit: cover"
              />
              <span>Dota 2</span>
            </a>
            <a id="btn-lol" href="./gamedetail_lol.html" class="game-btn">
              <img
                src="../resource/lol-logo.png"
                alt="LoL"
                style="width: 32px; height: 32px; object-fit: cover"
              />
              <span>LoL</span>
            </a>
          </div>
        </div>
      </div>

      <main class="main-content">
        <div class="info-banner">
          <h1 style="font-size: 1.25rem; font-weight: bold">pmsslnwza007</h1>
          <p style="font-size: 0.75rem; color: #d1d5db; margin-top: 6px">
            Game ID :
            <span style="font-weight: bold; color: white">PMSSLNWZA#0007</span>
          </p>
        </div>

        <div class="divider"></div>

        <section>
          <h2 class="section-title">Rank</h2>
          <div class="rank-card">
            <div class="rank-icon-placeholder"></div>
            <div>
              <div style="font-size: 1.5rem; font-weight: bold; color: #fabc60">
                Diamond IV
              </div>
              <div style="font-size: 1.125rem; font-weight: bold">75 LP</div>
            </div>
          </div>
        </section>

        <div class="divider"></div>

        <section>
          <h2 class="section-title">Top champions</h2>
          <div id="lol-champs-grid" class="grid grid-cols-2 gap-3"></div>
        </section>

        <div class="divider"></div>

        <section>
          <h2 class="section-title">Recent Matches</h2>
          <div id="lol-match-list" class="space-y-3"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a id="nav-home" href="#" class="nav-link"
          ><i class="fa-solid fa-house" style="font-size: 22px"></i
        ></a>
        <a id="nav-star" href="#" class="nav-link">
          <div class="star-icon-wrap">
            <i
              class="fa-solid fa-star"
              style="color: #1a1a2e; font-size: 14px"
            ></i>
          </div>
        </a>
        <a id="nav-add" href="#" class="nav-link"
          ><i class="fa-solid fa-plus" style="font-size: 26px"></i
        ></a>
        <a id="nav-heart" href="#" class="nav-link"
          ><i class="fa-solid fa-heart" style="font-size: 24px"></i
        ></a>
        <a id="nav-profile" href="#" class="nav-link"
          ><i class="fa-solid fa-circle-user" style="font-size: 26px"></i
        ></a>
      </nav>
    </div>

    <script src="../js/gamedetail_lol-script.js"></script>
  </body>
</html>
