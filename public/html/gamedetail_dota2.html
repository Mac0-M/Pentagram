<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gamedetail - Dota 2</title>

    <link rel="stylesheet" href="../css/gamedetail-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "app-bg": "#162447",
              "card-bg": "#1F4068",
              "nav-bg": "#1B1B2F",
              win: "#40AFFF",
              lose: "#FF4060",
              gold: "#FABC60",
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div class="app-container">
      <div class="top-fixed-section">
        <nav
          class="navbar"
          style="
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 16px;
          "
        >
          <!-- กลุ่มด้านซ้าย: เรียงจากซ้ายสุด 3 ขีด -> โลโก้ -->
          <div style="display: flex; align-items: center; gap: 20px">
            <!-- 1. ปุ่ม 3 ขีด / กากบาท -->
            <div class="desktop-menu-container">
              <!-- เพิ่ม width: 32px และจัดให้อยู่ตรงกลาง เพื่อล็อคขนาดไม่ให้โลโก้ขยับ -->
              <div
                class="hamburger-icon"
                id="hamburger-menu"
                style="
                  font-size: 24px;
                  cursor: pointer;
                  color: white;
                  width: 32px;
                  display: flex;
                  justify-content: center;
                "
              >
                <i class="fa-solid fa-bars" id="menu-icon"></i>
              </div>
            </div>

            <!-- 2. โลโก้ Pentagram -->
            <a
              href="javascript:void(0)"
              id="home-logo"
              style="display: flex; align-items: center"
            >
              <img
                src="../resource/pentagram-logo.png"
                alt="Pentagram Logo"
                class="navbar-logo"
              />
            </a>
          </div>
        </nav>

        <!-- Dropdown Menu กางเต็มความกว้าง (วางไว้ใต้ nav เหมือนเดิม) -->
        <div class="desktop-dropdown full-width-menu" id="desktop-dropdown">
          <a href="#"><i class="fa-solid fa-house"></i> Home</a>
          <a href="#"><i class="fa-solid fa-star"></i> Feed</a>
          <a href="#"><i class="fa-solid fa-plus"></i> Add</a>
          <a href="#"><i class="fa-solid fa-heart"></i> Favorite</a>
          <a href="#"><i class="fa-solid fa-circle-user"></i> Profile</a>
        </div>

        <div class="game-selector-panel">
          <div class="game-selector-header">
            <h2 style="font-size: 18px; font-weight: bold">Game Details</h2>
            <i
              class="fa-regular fa-circle-xmark"
              style="cursor: pointer; font-size: 20px"
            ></i>
          </div>
          <div class="game-btn-grid">
            <a id="btn-dota2" href="./gamedetail_dota2.html" class="game-btn">
              <img
                src="../resource/dota2-logo.png"
                alt="Dota 2"
                style="width: 32px; height: 32px; object-fit: cover"
              />
              <span>Dota 2</span>
            </a>
            <a id="btn-lol" href="./gamedetail_lol.html" class="game-btn">
              <img
                src="../resource/lol-logo.png"
                alt="LoL"
                style="width: 32px; height: 32px; object-fit: cover"
              />
              <span>LoL</span>
            </a>
          </div>
        </div>
      </div>

      <main class="main-content">
        <div class="info-banner">
          <h1 style="font-size: 1.25rem; font-weight: bold">pmsslnwza007</h1>
          <p style="font-size: 0.75rem; color: #d1d5db; margin-top: 6px">
            Game ID :
            <span style="font-weight: bold; color: white">PMSSLNWZA#0007</span>
          </p>
        </div>

        <div class="divider"></div>

        <section class="rank-section">
          <h2 class="section-title">Rank</h2>
          <div class="rank-card">
            <!-- รูป Rank -->
            <div
              class="rank-circle-wrap relative w-[96px] h-[96px] flex items-center justify-center shrink-0"
            >
              <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                <circle
                  cx="48"
                  cy="48"
                  r="44"
                  stroke="rgba(255, 255, 255, 0.1)"
                  stroke-width="4"
                  fill="none"
                />
                <circle
                  cx="48"
                  cy="48"
                  r="44"
                  stroke="#FABC60"
                  stroke-width="4"
                  fill="none"
                  stroke-linecap="round"
                  stroke-dasharray="276"
                  stroke-dashoffset="276"
                  id="dota-progress-ring"
                />
              </svg>
              <img
                src="../resource/dota2-rank.png"
                alt="Dota 2 Rank"
                class="rank-image relative z-10 !w-[76px] !h-[76px]"
              />
            </div>

            <div
              class="rank-name"
              style="font-size: 1.5rem; font-weight: bold; color: #fabc60"
            >
              Diamond IV
            </div>
            <div
              class="rank-mmr"
              style="font-size: 1.125rem; font-weight: bold"
            >
              75 LP
            </div>
          </div>
        </section>

        <div class="divider"></div>
        <section class="character-section">
          <h2 class="section-title">Top Heroes</h2>
          <div id="dota2-heroes-grid" class="grid grid-cols-2 gap-3"></div>
        </section>

        <div class="divider"></div>

        <section class="recent-section">
          <h2 class="section-title">Recent Matches</h2>
          <div id="dota2-match-list" class="space-y-3"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a id="nav-home" href="#" class="nav-link"
          ><i class="fa-solid fa-house" style="font-size: 22px"></i
        ></a>
        <a id="nav-feed" href="#" class="nav-link">
          <div class="star-icon-wrap">
            <i
              class="fa-solid fa-star"
              style="color: #1a1a2e; font-size: 14px"
            ></i>
          </div>
        </a>
        <a id="nav-add" href="#" class="nav-link"
          ><i class="fa-solid fa-plus" style="font-size: 26px"></i
        ></a>
        <a id="nav-favorite" href="#" class="nav-link"
          ><i class="fa-solid fa-heart" style="font-size: 24px"></i
        ></a>
        <a id="nav-profile" href="#" class="nav-link"
          ><i class="fa-solid fa-circle-user" style="font-size: 26px"></i
        ></a>
      </nav>
    </div>

    <script src="../js/gamedetail_dota2-script.js"></script>
  </body>
</html>
