<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gamedetail - Dota 2</title>

    <link rel="stylesheet" href="../css/gamedetail-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "app-bg": "#162447",
              "card-bg": "#1F4068",
              "nav-bg": "#1B1B2F",
              win: "#40AFFF",
              lose: "#FF4060",
              gold: "#FABC60",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-900 text-white font-sans antialiased">
    <div
      class="w-full max-w-[480px] mx-auto bg-app-bg min-h-screen relative shadow-2xl pt-[220px] pb-[70px]"
    >
      <div
        class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 bg-app-bg shadow-xl"
      >
        <div id="navbar-placeholder">
          <nav
            class="h-[70px] bg-[#1B1B2F] border-b border-white/20 flex items-center justify-between px-4 box-border"
          >
            <a href="javascript:void(0)" id="home-logo">
              <img
                src="../resource/pentagram-logo.png"
                alt="Pentagram Logo"
                class="h-[35px] object-contain"
              />
            </a>
            <div class="text-white text-xl cursor-pointer">
              <i class="fa-solid fa-xmark"></i>
            </div>
          </nav>
        </div>

        <div
          class="h-auto bg-[#162447] px-3 py-4 border-b border-white/10 box-border"
        >
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-white text-[18px] font-bold">Game Details</h2>
            <i
              class="fa-regular fa-circle-xmark text-white text-xl cursor-pointer"
            ></i>
          </div>
          <div class="grid grid-cols-2 gap-2 w-full">
            <a
              id="btn-dota2"
              href="./gamedetail_dota2.html"
              class="flex items-center justify-center gap-3 h-[60px] rounded font-bold transition-all shadow-md"
            >
              <img
                src="../resource/dota2-logo.png"
                alt="Dota 2"
                class="w-8 h-8 rounded-sm object-cover"
              />
              <span>Dota 2</span>
            </a>
            <a
              id="btn-lol"
              href="./gamedetail_lol.html"
              class="flex items-center justify-center gap-3 h-[60px] rounded font-bold transition-all shadow-md"
            >
              <img
                src="../resource/lol-logo.png"
                alt="LoL"
                class="w-8 h-8 rounded-sm object-cover"
              />
              <span>LoL</span>
            </a>
          </div>
        </div>
      </div>

      <main class="p-3 space-y-4">
        <div
          class="bg-nav-bg border border-white/20 rounded-lg p-4 h-[82px] flex flex-col justify-center"
        >
          <h1 class="text-xl font-bold">pmsslnwza007</h1>
          <p class="text-xs text-gray-300 mt-1.5">
            Game ID :
            <span class="font-bold text-white tracking-wide">125168159</span>
          </p>
        </div>

        <div class="h-px bg-white/20 w-full"></div>

        <section>
          <h2 class="section-title">Rank</h2>
          <div class="rank-card">
            <img
              src="../resource/dota2-rank.png"
              alt="Dota 2 Rank"
              class="rank-image"
            />
            <div>
              <div style="font-size: 1.5rem; font-weight: bold; color: #fabc60">
                Archon 1
              </div>
              <div style="font-size: 1.125rem; font-weight: bold">
                2,310 MMR
              </div>
            </div>
          </div>
        </section>

        <div class="h-px bg-white/20 w-full"></div>

        <section>
          <h2 class="text-lg font-bold mb-3 h-6 flex items-center">
            Top Heroes
          </h2>
          <div class="grid grid-cols-2 gap-3" id="dota2-heroes-grid"></div>
        </section>

        <div class="h-px bg-white/20 w-full"></div>

        <section>
          <h2 class="text-lg font-bold mb-3 h-6 flex items-center">
            Recent Matches
          </h2>
          <div class="space-y-3" id="dota2-match-list"></div>
        </section>
      </main>

      <nav
        class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] z-50 h-[60px] bg-[#1a1a2e] border-t border-white/20 flex items-center justify-around px-2 box-border"
      >
        <a
          id="nav-home"
          href="#"
          class="p-2 flex items-center justify-center transition-colors"
        >
          <i class="fa-solid fa-house text-[22px]"></i>
        </a>
        <a
          id="nav-star"
          href="#"
          class="p-2 flex items-center justify-center transition-colors"
        >
          <div
            class="w-7 h-7 bg-current rounded-full flex items-center justify-center"
          >
            <i class="fa-solid fa-star text-[#1a1a2e] text-[14px]"></i>
          </div>
        </a>
        <a
          id="nav-add"
          href="#"
          class="p-2 flex items-center justify-center transition-colors"
        >
          <i class="fa-solid fa-plus text-[26px]"></i>
        </a>
        <a
          id="nav-heart"
          href="#"
          class="p-2 flex items-center justify-center transition-colors"
        >
          <i class="fa-solid fa-heart text-[24px]"></i>
        </a>
        <a
          id="nav-profile"
          href="#"
          class="p-2 flex items-center justify-center transition-colors"
        >
          <i class="fa-solid fa-circle-user text-[26px]"></i>
        </a>
      </nav>
    </div>

    <script src="../js/gamedetail_dota2-script.js"></script>
  </body>
</html>
