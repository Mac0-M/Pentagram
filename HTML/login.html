<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pentagram - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="../CSS/global-style.css">
    <link rel="stylesheet" href="../CSS/auth-landing-style.css">
</head>
<body>

    <div class="auth-page-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>

        <div class="auth-wrapper">
            <div class="logo-container">
                <img src="../assets/logo.png" alt="Pentagram" class="auth-logo-image">
            </div>

            <div class="auth-card">
                <h3>Welcome Back</h3>
                <p>Enter your credentials to access the arena.</p>

                <form action="feeds.html" method="GET">
                    
                    <div class="input-group">
                        <input type="text" placeholder="Username or Email" required>
                        <i class="fas fa-user"></i>
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password" required>
                        <i class="fas fa-lock"></i>
                    </div>

                    <div class="forgot-pass">
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-submit-btn">LOGIN</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Sign up</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
