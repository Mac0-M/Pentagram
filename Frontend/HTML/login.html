<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pentagram - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../CSS/global-style.css" />
    <link rel="stylesheet" href="../CSS/auth-landing-style.css" />
  </head>

  <body class="auth-body">
    <div class="auth-page-container">
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>

      <div class="auth-wrapper">
        <div class="logo-container">
          <img
            src="../assets/logo.png"
            alt="Pentagram"
            class="auth-logo-image"
          />
        </div>

        <div class="auth-card">
          <h3>Welcome Back</h3>
          <p>Enter your credentials to access the arena.</p>

          <form id="auth-form">
            <div id="step-1">
              <div class="input-group">
                <input
                  type="text"
                  id="username"
                  placeholder="Gamer Tag"
                  required
                />
                <i class="fas fa-gamepad"></i>
              </div>
              <div class="input-group">
                <input
                  type="password"
                  id="password"
                  placeholder="Password"
                  required
                />
                <i class="fas fa-lock"></i>
              </div>
              <button type="submit" class="auth-submit-btn">LOGIN</button>
            </div>

            <div id="step-2" style="display: none">
              <div class="input-group">
                <input
                  type="text"
                  id="token2fa"
                  placeholder="Enter 6-digit Code"
                  maxlength="6"
                />
                <i class="fas fa-shield-halved"></i>
              </div>
              <p
                style="
                  color: rgba(255, 255, 255, 0.8);
                  font-size: 0.9rem;
                  margin: 0 0 12px;
                  text-align: center;
                "
              >
                The code refreshes every 30 seconds in Google Authenticator.
              </p>
              <button type="submit" id="verify-btn" class="auth-submit-btn">
                VERIFY
              </button>
            </div>
          </form>

          <div class="auth-footer">
            Don't have an account? <a href="register.html">Sign up</a>
          </div>
        </div>
      </div>
    </div>
    <script src="../JS/pages/auth-login.js" defer></script>

    <!-- Background Prefetching to cache game data instantly before user logs in (handled automatically by api_client.js) -->
    <script src="../JS/core/api_client.js"></script>
  </body>
</html>
