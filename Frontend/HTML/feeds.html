<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pentagram Feed</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../CSS/global-style.css" />
    <link rel="stylesheet" href="../CSS/header-style.css" />
    <link rel="stylesheet" href="../CSS/feeds-style.css" />
    <link rel="stylesheet" href="../CSS/fav-post-style.css" />
  </head>

  <body>
    <div id="navigation-placeholder"></div>

    <main class="feed-page">
  <div class="feed-list">
    <div class="search-container-box">
      <div class="search-wrapper-inner">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
          type="text" 
          id="feedSearchInput" 
          placeholder="Search creators or keywords..." 
          autocomplete="off"
        />
        <button id="clearSearchBtn" class="clear-search-btn" style="display: none;">
          <i class="fa-solid fa-circle-xmark"></i>
        </button>
      </div>
    </div>

    <div id="feedList" class="inner-feed-list"></div>
  </div>
</main>

    <!-- POST DETAIL MODAL -->
    <div class="post-detail-modal" id="postDetailModal">
      <div class="post-detail-container">
        <button class="close-detail-btn" onclick="closePostDetail()">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="postDetailContent"></div>
      </div>
    </div>

    <!-- COMMENTS MODAL -->

    <div class="comment-modal" id="commentModal">
      <div class="comment-box">
        <div class="comment-header">
          <div class="drag-line"></div>

          <h3>Comments</h3>

          <button id="closeCommentBtn">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="comment-list" id="commentList"></div>

        <div class="comment-input-wrapper">
          <img src="../assets/logo.png" class="my-avatar" />

          <input type="text" id="commentInput" placeholder="Add a comment..." />

          <button id="sendCommentBtn">Post</button>
        </div>
      </div>
    </div>

    <script src="../JS/components/header.js"></script>
    <script src="../JS/pages/feeds.js"></script>
  </body>
</html>
