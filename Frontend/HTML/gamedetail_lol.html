<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gamedetail - LOL</title>

    <link rel="stylesheet" href="../CSS/global-style.css" />
    <link rel="stylesheet" href="../CSS/header-style.css" />
    <link rel="stylesheet" href="../CSS/gamedetail-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "app-bg": "#162447",
              "card-bg": "#1F4068",
              "nav-bg": "#1B1B2F",
              win: "#40AFFF",
              lose: "#FF4060",
              gold: "#FABC60",
            },
          },
        },
      };
    </script>
  </head>

  <body>
    <div id="navigation-placeholder"></div>

    <!-- Game Selector -->
    <div class="game-selector-panel">
      <div class="game-selector-header">
        <h2>Game Details</h2>
      </div>
      <div class="game-btn-grid">
        <a id="btn-dota2" href="./gamedetail_dota2.html" class="game-btn">
          <img src="../assets/dota2-logo.png" alt="Dota 2" class="game-icon" />
          <span class="game-name">Dota 2</span>
        </a>
        <a id="btn-lol" href="./gamedetail_lol.html" class="game-btn">
          <img src="../assets/lol-logo.png" alt="LoL" class="game-icon" />
          <span class="game-name">LoL</span>
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- User Detail Banner -->
      <div class="info-banner">
        <h1></h1>
        <p>
          Game ID :
          <span></span>
        </p>
      </div>

      <div class="divider"></div>

      <!-- Rank Section -->
      <section class="rank-section">
        <h2 class="section-title">Rank</h2>
        <div class="rank-card">
          <div
            class="rank-circle-wrap relative w-[96px] h-[96px] flex items-center justify-center shrink-0"
          >
            <svg class="absolute inset-0 w-full h-full transform -rotate-90">
              <circle
                cx="48"
                cy="48"
                r="44"
                stroke="rgba(255, 255, 255, 0.1)"
                stroke-width="4"
                fill="none"
              />
              <circle
                cx="48"
                cy="48"
                r="44"
                stroke="#FABC60"
                stroke-width="4"
                fill="none"
                stroke-linecap="round"
                stroke-dasharray="276"
                stroke-dashoffset="0"
                id="rank-progress-ring"
              />
            </svg>
            <!-- วงกลมพื้นหลังเพื่อให้รูปแรงค์มีขนาดวงที่พอดี -->
            <div
              class="absolute w-[76px] h-[76px] rounded-full bg-[#2a3a5a] z-0"
            ></div>
            <img
              src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='s' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%232a3a5a'/><stop offset='100%' stop-color='%231b2845'/></linearGradient><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23fabc60'/><stop offset='100%' stop-color='%23d97706'/></linearGradient></defs><circle cx='50' cy='50' r='40' fill='url(%23s)' stroke='url(%23g)' stroke-width='3'/><circle cx='50' cy='50' r='32' fill='none' stroke='rgba(250,188,96,0.15)' stroke-width='1' stroke-dasharray='3,3'/><text x='50' y='62' font-family='sans-serif' font-size='36' font-weight='bold' fill='url(%23g)' text-anchor='middle'>?</text></svg>"
              alt="LoL Rank"
              class="rank-image relative z-10 !w-[76px] !h-[76px] !bg-transparent transform scale-[1.3]"
            />
          </div>
          <div class="rank-name">Unranked</div>
          <div class="rank-mmr">---- LP</div>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Top Champions Section -->
      <section class="character-section">
        <h2 class="section-title">Top champions</h2>
        <div id="lol-champs-grid" class="grid grid-cols-2 gap-3"></div>
      </section>

      <div class="divider"></div>

      <!-- Recent Matches Section -->
      <section class="recent-section">
        <h2 class="section-title">Recent Matches</h2>
        <div id="lol-match-list" class="space-y-3"></div>
      </section>
    </main>

    <script src="../JS/components/header.js"></script>
    <script src="../JS/core/api_client.js"></script>
    <script src="../JS/pages/gamedetail_lol.js"></script>
  </body>
</html>
